name: HUQAN Plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: obsidian-plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate submission and release contract
        run: npm run check:release

      - name: Run plugin tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Generate artifact provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Verify committed bundle is reproducible
        run: git diff --exit-code -- main.js styles.css

      - name: Upload validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huqan-trust-panel-release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: huqan-trust-panel-release-assets
          path: .

      - name: Verify tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "Tag $TAG does not match manifest version $VERSION." >&2
            exit 1
          fi
          echo "Publishing plugin version $VERSION."

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "HUQAN $TAG" \
            --notes "HUQAN. Requires a local HUQAN runtime. Verification is read-only and API keys are restricted to loopback endpoints." \
            main.js manifest.json styles.css
